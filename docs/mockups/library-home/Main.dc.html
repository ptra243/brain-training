<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1f1611}
a{color:#d9b864}a:hover{color:#f0d68a}
.spine{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;box-sizing:border-box;text-decoration:none;border-radius:3px 3px 0 0;box-shadow:inset -4px 0 0 rgba(0,0,0,.28),inset 3px 0 0 rgba(255,255,255,.07)}
.spine-title{writing-mode:vertical-rl;font-family:'EB Garamond',Georgia,serif;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.rule{width:70%;height:0;border-top:1px solid currentColor;border-bottom:1px solid currentColor;padding-top:2px;opacity:.85}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 22px; background: #1f1611; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #e9e4d2">

  <header style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-top: 8px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'EB Garamond', Georgia, serif; font-weight: 600; font-size: 36px; line-height: 1; color: #efe7d2">Casebook</h1>
      <p style="margin: 0; font-size: 14px; color: #b9ab93">Take a book off the shelf.</p>
    </div>
    <a href="#record" aria-label="Your record" style="width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: #2e1d12; border: 1px solid #5c3b25; color: #d9b864">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="5.5"></circle><path d="M8.5 13.5 7 21l5-2.5 5 2.5-1.5-7.5"></path></svg>
    </a>
  </header>

  <!-- Quick play bookcase -->
  <section aria-labelledby="qp" style="display: flex; flex-direction: column; background: #4a2f1e; border-radius: 6px 6px 3px 3px; padding: 10px 10px 0; box-shadow: 0 10px 24px rgba(0,0,0,.45)">
    <div style="display: flex; justify-content: center; padding-bottom: 10px">
      <h2 id="qp" style="margin: 0; padding: 5px 16px; background: #c8a24c; border: 1px solid #8e6f27; border-radius: 3px; font-family: 'EB Garamond', Georgia, serif; font-weight: 700; font-size: 14px; letter-spacing: .16em; color: #2a1d0f">QUICK PLAY</h2>
    </div>
    <div style="height: 232px; background: #22160f; display: flex; align-items: flex-end; gap: 4px; padding: 0 10px; box-shadow: inset 0 8px 14px rgba(0,0,0,.5)">

      <a href="Open.dc.html" aria-label="Your case, The Orchid Room: continue" class="spine" style="width: 66px; height: 222px; margin-bottom: 0; padding: 10px 0 12px; background: #5a1426; color: #d9b864; transform: translateY(-10px); box-shadow: inset -4px 0 0 rgba(0,0,0,.28), 0 10px 14px rgba(0,0,0,.55)">
        <span class="rule"></span>
        <span class="spine-title" style="font-size: 19px">The Orchid Room</span>
        <span style="display: flex; flex-direction: column; align-items: center; gap: 4px">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #d9b864"></span>
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #d9b864"></span>
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #d9b864"></span>
          <span style="width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid #d9b864; box-sizing: border-box"></span>
          <span style="width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid #d9b864; box-sizing: border-box"></span>
        </span>
        <span class="rule"></span>
        <span aria-hidden="true" style="position: absolute; bottom: -24px; left: 40px; width: 11px; height: 30px; background: #c8a24c; clip-path: polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)"></span>
      </a>

      <a href="#new-case" aria-label="New case" class="spine" style="width: 58px; height: 198px; padding: 10px 0 12px; background: #24463c; color: #d9b864">
        <span class="rule"></span>
        <span class="spine-title" style="font-size: 18px">New case</span>
        <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 50%; background: #a8322d; box-shadow: inset 0 0 0 3px #8a2620, 0 1px 0 rgba(0,0,0,.4)"></span>
      </a>

      <a href="#choose" aria-label="Choose your games" class="spine" style="width: 58px; height: 210px; padding: 10px 0 12px; background: #1f2f4a; color: #d9b864">
        <span class="rule"></span>
        <span class="spine-title" style="font-size: 17px">Choose your games</span>
        <svg width="26" height="22" viewBox="0 0 26 22" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="10" height="15" rx="1.5" transform="rotate(-14 8 11)"></rect><rect x="8" y="3" width="10" height="15" rx="1.5"></rect><rect x="13" y="4" width="10" height="15" rx="1.5" transform="rotate(14 18 11)"></rect></svg>
      </a>

      <a href="#record" aria-label="Solved cases" style="display: flex; align-items: flex-end; gap: 2px; margin-left: 6px; text-decoration: none">
        <span class="spine" style="width: 24px; height: 176px; background: #3b2a22"><span class="spine-title" style="font-size: 11px; color: #a89268; padding-top: 10px">Solved</span></span>
        <span class="spine" style="width: 28px; height: 168px; background: #34403a"><span class="spine-title" style="font-size: 11px; color: #a89268; padding-top: 10px">Solved</span></span>
        <span class="spine" style="width: 22px; height: 182px; background: #2c3444"></span>
        <span class="spine" style="width: 26px; height: 160px; background: #4a3a28; transform: rotate(-9deg); transform-origin: bottom left; margin-left: 4px"></span>
      </a>
    </div>
    <div style="height: 16px; margin: 0 -10px; background: #6b4529; border-top: 3px solid #8a5e3a; border-radius: 0 0 3px 3px"></div>
  </section>

  <!-- Campaign bookcase -->
  <section aria-labelledby="cp" style="display: flex; flex-direction: column; background: #4a2f1e; border-radius: 6px 6px 3px 3px; padding: 10px 10px 0; box-shadow: 0 10px 24px rgba(0,0,0,.45)">
    <div style="display: flex; justify-content: center; padding-bottom: 10px">
      <h2 id="cp" style="margin: 0; padding: 5px 16px; background: #c8a24c; border: 1px solid #8e6f27; border-radius: 3px; font-family: 'EB Garamond', Georgia, serif; font-weight: 700; font-size: 14px; letter-spacing: .16em; color: #2a1d0f">CAMPAIGN</h2>
    </div>
    <div style="height: 232px; background: #22160f; display: flex; align-items: flex-end; gap: 4px; padding: 0 10px; box-shadow: inset 0 8px 14px rgba(0,0,0,.5)">

      <a href="#campaign" aria-label="Your campaign, midnight, round 2 of 3: continue" class="spine" style="width: 70px; height: 222px; padding: 10px 0 12px; background: #3e2a44; color: #d9b864; transform: translateY(-10px); box-shadow: inset -4px 0 0 rgba(0,0,0,.28), 0 10px 14px rgba(0,0,0,.55)">
        <span class="rule"></span>
        <span class="spine-title" style="font-size: 20px">Midnight</span>
        <span style="font-size: 10px; letter-spacing: .08em; color: #e9dcb8">2 of 3</span>
        <span aria-hidden="true" style="display: flex; flex-direction: column; gap: 5px; align-items: center">
          <svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true"><path d="M7 1c2 3 2 5 0 7-2-2-2-4 0-7z" fill="#f0c860"></path><rect x="4" y="9" width="6" height="9" rx="1" fill="#efe7d2"></rect></svg>
          <svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true"><path d="M7 1c2 3 2 5 0 7-2-2-2-4 0-7z" fill="#f0c860"></path><rect x="4" y="9" width="6" height="9" rx="1" fill="#efe7d2"></rect></svg>
          <svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true"><rect x="4" y="9" width="6" height="9" rx="1" fill="#7d6f80"></rect></svg>
        </span>
        <span class="rule"></span>
        <span aria-hidden="true" style="position: absolute; bottom: -24px; left: 44px; width: 11px; height: 30px; background: #c8a24c; clip-path: polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)"></span>
      </a>

      <a href="#new-campaign" aria-label="New campaign" class="spine" style="width: 62px; height: 204px; padding: 10px 0 12px; background: #4a1a1a; color: #d9b864">
        <span class="rule"></span>
        <span class="spine-title" style="font-size: 18px">New campaign</span>
        <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 50%; background: #a8322d; box-shadow: inset 0 0 0 3px #8a2620, 0 1px 0 rgba(0,0,0,.4)"></span>
      </a>

      <a href="#record" aria-label="Finished campaigns" style="display: flex; align-items: flex-end; gap: 2px; margin-left: 6px; text-decoration: none">
        <span class="spine" style="width: 30px; height: 186px; background: #2f2a3a"><span class="spine-title" style="font-size: 11px; color: #a89268; padding-top: 10px">Caught</span></span>
        <span class="spine" style="width: 28px; height: 178px; background: #3a2420"><span class="spine-title" style="font-size: 11px; color: #a89268; padding-top: 10px">Escaped</span></span>
      </a>

      <span aria-hidden="true" style="margin-left: auto; width: 34px; height: 64px; background: #8e6f27; border-radius: 3px 14px 0 0; box-shadow: inset -3px 0 0 #6e561e"></span>
    </div>
    <div style="height: 16px; margin: 0 -10px; background: #6b4529; border-top: 3px solid #8a5e3a; border-radius: 0 0 3px 3px"></div>
  </section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
