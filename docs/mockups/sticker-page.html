<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sticker page at the back</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;0,700;1,500&amp;family=Caveat:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#3a7058}
a{color:#8a2620}a:hover{color:#5a1426}
.tab{width:76px;height:40px;border:0;border-radius:8px 8px 0 0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'EB Garamond',Georgia,serif;font-weight:600;font-size:15px}
</style>
<style>body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="position: relative; width: 360px; height: 780px; box-sizing: border-box; padding: 18px 0 0; display: flex; flex-direction: column; overflow: hidden; background-color: #3a7058; background-image: radial-gradient(rgba(255,255,255,.045) 1px, transparent 1px); background-size: 5px 5px; border-top: 10px solid #b37a44; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #f6eedb">

  <header style="display: grid; grid-template-columns: 46px 1fr 46px; align-items: center; gap: 6px; padding: 0 12px">
    <a href="#shelf" aria-label="Back to the shelf" style="width: 46px; height: 46px; display: grid; place-items: center">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true" style="filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.45)); transform: rotate(-6deg)"><circle cx="20" cy="20" r="18" fill="#fbf4e2"></circle><circle cx="20" cy="20" r="14.5" fill="#9a5a32"></circle><path d="M23 13l-7 7 7 7" fill="none" stroke="#fbf4e2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </a>
    <div style="text-align: center">
      <h1 style="margin: 0; font-family: 'EB Garamond', Georgia, serif; font-weight: 600; font-size: 22px; line-height: 1.1">The Orchid Room</h1>
      <p style="margin: 2px 0 0; font-size: 13px; color: #eadfc4">Final puzzle · 5 stickers to place</p>
    </div>
    <a href="#notebook" aria-label="Open your notebook" style="width: 46px; height: 46px; display: grid; place-items: center">
      <svg width="34" height="40" viewBox="0 0 34 40" aria-hidden="true" style="filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.45)); transform: rotate(6deg)"><rect x="3" y="4" width="28" height="34" rx="3" fill="#b98a5a"></rect><rect x="23" y="4" width="4" height="34" fill="#8a2e3b"></rect><rect x="7" y="12" width="13" height="7" rx="1" fill="#fbf4e2"></rect><path d="M8 1v6M14 1v6M20 1v6M26 1v6" stroke="#5b4a3a" stroke-width="2" stroke-linecap="round"></path></svg>
    </a>
  </header>

  <nav aria-label="Puzzle book sections" style="display: flex; gap: 4px; padding: 14px 20px 0">
    <button class="tab" style="background: #4f7a54; color: #fbf3e0">Case</button>
    <button class="tab" style="background: #9a5a32; color: #fbf3e0">Map</button>
    <button aria-current="page" class="tab" style="background: #fbf7ec; color: #8a2e3b; box-shadow: 0 -2px 4px rgba(0,0,0,.15)">Stickers</button>
  </nav>

  <div style="flex: 1; display: flex; flex-direction: column; background: #fbf7ec; box-shadow: 0 -4px 12px rgba(0,0,0,.3)">
    <article style="background: #fbf7ec; padding: 10px 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; color: #1e2a2f">
      <div style="align-self: stretch; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1.5px solid #1e2a2f; padding-bottom: 5px">
        <span style="font-family: 'EB Garamond', Georgia, serif; font-weight: 700; font-size: 15px; letter-spacing: .04em">STICKER PAGE</span>
        <span style="font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 14px; color: #55615f">Fit every clue in the house</span>
      </div>

      <img src="shots/jigsaw-board.png" alt="The real Jigsaw board from the app, hunches and the body already in, room names showing" style="display: block; width: 100%; height: auto; border-radius: 4px">

      <p style="margin: 0; font-size: 12px; line-height: 1.4; color: #55615f; text-align: center">Peel a sticker and press it into a room. Lift a corner to move it.</p>
    </article>

    <div style="height: 0; border-top: 2px dashed #c9bd9f"></div>

    <section aria-label="Sticker sheet" style="background-color: #e6ecee; background-image: repeating-linear-gradient(135deg, rgba(120,140,150,.08) 0 2px, transparent 2px 8px); flex: 1; padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 6px; color: #2a3a42">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 10px; font-weight: 700; letter-spacing: .16em; color: #5a6a72">STICKER SHEET</span>
        <span style="font-size: 12px; color: #4a5a62">5 left</span>
      </div>
      <img src="shots/jigsaw-tray.png" alt="The real Jigsaw tray: the candlestick, vase, wrench, poison bottle and knife pieces" style="display: block; width: 100%; height: auto; border-radius: 6px">
    </section>
  </div>
</div>
</body>
</html>
