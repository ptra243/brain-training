<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sticker page at the back</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;0,700;1,500&amp;family=Caveat:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#3a7058}
a{color:#8a2620}a:hover{color:#5a1426}
.tab{width:76px;height:40px;border:0;border-radius:8px 8px 0 0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'EB Garamond',Georgia,serif;font-weight:600;font-size:15px}
</style>
<style>body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="position: relative; width: 360px; height: 780px; box-sizing: border-box; padding: 18px 0 0; display: flex; flex-direction: column; overflow: hidden; background-color: #3a7058; background-image: radial-gradient(rgba(255,255,255,.045) 1px, transparent 1px); background-size: 5px 5px; border-top: 10px solid #b37a44; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #f6eedb">

  <header style="display: grid; grid-template-columns: 46px 1fr 46px; align-items: center; gap: 6px; padding: 0 12px">
    <a href="#shelf" aria-label="Back to the shelf" style="width: 46px; height: 46px; display: grid; place-items: center">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true" style="filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.45)); transform: rotate(-6deg)"><circle cx="20" cy="20" r="18" fill="#fbf4e2"></circle><circle cx="20" cy="20" r="14.5" fill="#9a5a32"></circle><path d="M23 13l-7 7 7 7" fill="none" stroke="#fbf4e2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </a>
    <div style="text-align: center">
      <h1 style="margin: 0; font-family: 'EB Garamond', Georgia, serif; font-weight: 600; font-size: 22px; line-height: 1.1">The Orchid Room</h1>
      <p style="margin: 2px 0 0; font-size: 13px; color: #eadfc4">Final puzzle · 3 of 8 stickers in</p>
    </div>
    <a href="#notebook" aria-label="Open your notebook" style="width: 46px; height: 46px; display: grid; place-items: center">
      <svg width="34" height="40" viewBox="0 0 34 40" aria-hidden="true" style="filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.45)); transform: rotate(6deg)"><rect x="3" y="4" width="28" height="34" rx="3" fill="#b98a5a"></rect><rect x="23" y="4" width="4" height="34" fill="#8a2e3b"></rect><rect x="7" y="12" width="13" height="7" rx="1" fill="#fbf4e2"></rect><path d="M8 1v6M14 1v6M20 1v6M26 1v6" stroke="#5b4a3a" stroke-width="2" stroke-linecap="round"></path></svg>
    </a>
  </header>

  <nav aria-label="Puzzle book sections" style="display: flex; gap: 4px; padding: 14px 20px 0">
    <button class="tab" style="background: #4f7a54; color: #fbf3e0">Case</button>
    <button class="tab" style="background: #9a5a32; color: #fbf3e0">Map</button>
    <button aria-current="page" class="tab" style="background: #fbf7ec; color: #8a2e3b; box-shadow: 0 -2px 4px rgba(0,0,0,.15)">Stickers</button>
  </nav>

  <div style="flex: 1; display: flex; flex-direction: column; background: #fbf7ec; box-shadow: 0 -4px 12px rgba(0,0,0,.3)">
    <article style="background: #fbf7ec; padding: 10px 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; color: #1e2a2f">
      <div style="align-self: stretch; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1.5px solid #1e2a2f; padding-bottom: 5px">
        <span style="font-family: 'EB Garamond', Georgia, serif; font-weight: 700; font-size: 15px; letter-spacing: .04em">STICKER PAGE</span>
        <span style="font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 14px; color: #55615f">Fit every clue in the house</span>
      </div>

      <svg width="336" height="296" viewBox="-6 -6 268 236" role="img" aria-label="Sticker album page: the house in six sections, with three stickers placed">
        <defs>
          <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.1" flood-color="#000" flood-opacity=".35"></feDropShadow></filter>
          <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#d2dce6"></rect><path d="M0 0v6" stroke="#8a9aa8" stroke-width="1.5"></path></pattern>
        </defs>
        <rect x="0" y="0" width="96" height="96" fill="#ecdba8"></rect>
        <rect x="96" y="0" width="64" height="224" fill="#ead5c5"></rect>
        <rect x="160" y="0" width="96" height="96" fill="#cddabd"></rect>
        <rect x="0" y="96" width="96" height="128" fill="#d2dce6"></rect>
        <rect x="160" y="96" width="96" height="96" fill="#d9e8cb"></rect>
        <rect x="160" y="192" width="96" height="32" fill="#dcd8cf"></rect>
        <g stroke="rgba(59,49,40,.16)" stroke-width="1">
          <path d="M32 0v224M64 0v224M96 0v224M128 0v224M160 0v224M192 0v224M224 0v224M0 32h256M0 64h256M0 96h256M0 128h256M0 160h256M0 192h256"></path>
        </g>
        <g fill="none" stroke="#3b3128" stroke-width="2.5">
          <rect x="0" y="0" width="96" height="96"></rect><rect x="96" y="0" width="64" height="224"></rect><rect x="160" y="0" width="96" height="96"></rect><rect x="0" y="96" width="96" height="128"></rect><rect x="160" y="96" width="96" height="96"></rect><rect x="160" y="192" width="96" height="32"></rect>
        </g>
        <g font-family="'EB Garamond', Georgia, serif" font-weight="600" font-size="10.5" fill="#2a2620">
          <text x="4" y="11">Kitchen</text><text x="100" y="11">Hall</text><text x="164" y="11">Library</text><text x="4" y="107">Study</text><text x="164" y="107">Conservatory</text><text x="164" y="211" font-style="italic">Unknown</text>
        </g>

        <rect x="0" y="192" width="32" height="32" fill="url(#hatch)"></rect>
        <rect x="194" y="130" width="60" height="28" rx="4" fill="none" stroke="#a8322d" stroke-width="2"></rect>
        <text x="224" y="149" text-anchor="middle" font-family="'Caveat', cursive" font-weight="700" font-size="15" fill="#a8322d">the body</text>

        <polygon points="3,16 61,16 61,35 93,35 93,61 35,61 35,45 3,45" fill="rgba(255,255,255,.4)" stroke="#8a7a5c" stroke-width="1.6" stroke-dasharray="4 3"></polygon>

        <g filter="url(#sh)">
          <polygon points="96,32 128,32 128,64 160,64 160,96 96,96" fill="#34436a" stroke="#fbf6ea" stroke-width="4" stroke-linejoin="round"></polygon>
          <circle cx="112" cy="80" r="10" fill="#34436a" stroke="#d2a548" stroke-width="2"></circle>
          <text x="112" y="84.5" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-weight="700" font-size="13" fill="#fbf7ea">B</text>
        </g>
        <g filter="url(#sh)">
          <rect x="160" y="32" width="64" height="32" fill="#cf9f43" stroke="#fbf6ea" stroke-width="4" stroke-linejoin="round"></rect>
          <rect x="189" y="42" width="6" height="16" fill="#fbf6ea"></rect>
          <path d="M192 33.5c3 4 3 6 0 7.5-3-1.5-3-3.5 0-7.5z" fill="#a8322d"></path>
          <rect x="185" y="57" width="14" height="3" fill="#6b4529"></rect>
        </g>
        <g filter="url(#sh)">
          <rect x="32" y="96" width="32" height="96" fill="#4f7a54" stroke="#fbf6ea" stroke-width="4" stroke-linejoin="round"></rect>
          <circle cx="48" cy="160" r="10" fill="#4f7a54" stroke="#d2a548" stroke-width="2"></circle>
          <text x="48" y="164.5" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-weight="700" font-size="13" fill="#fbf7ea">U</text>
          <path d="M66 94 L50 94 L66 110 Z" fill="#efe9d8"></path>
          <path d="M50 94 L66 110" stroke="rgba(0,0,0,.28)" stroke-width="1.2"></path>
        </g>
      </svg>

      <p style="margin: 0; font-size: 12px; line-height: 1.4; color: #55615f; text-align: center">Peel a sticker and press it into a room. Lift a corner to move it.</p>
    </article>

    <div style="height: 0; border-top: 2px dashed #c9bd9f"></div>

    <section aria-label="Sticker sheet" style="background-color: #e6ecee; background-image: repeating-linear-gradient(135deg, rgba(120,140,150,.08) 0 2px, transparent 2px 8px); flex: 1; padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 6px; color: #2a3a42">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 10px; font-weight: 700; letter-spacing: .16em; color: #5a6a72">STICKER SHEET</span>
        <span style="font-size: 12px; color: #4a5a62">5 left</span>
      </div>
      <svg width="332" height="150" viewBox="0 0 300 136" role="img" aria-label="Stickers left: the Hostess, the Financier, a hunch, the Detective, and the rope. Three shapes already peeled off.">
        <defs><filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity=".3"></feDropShadow></filter></defs>
        <g filter="url(#sh2)">
          <polygon points="6,8 72,8 72,30 50,30 50,52 28,52 28,30 6,30" fill="#c4847f" stroke="#fbf6ea" stroke-width="3.5" stroke-linejoin="round"></polygon>
          <text x="39" y="24" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-weight="700" font-size="13" fill="#fbf7ea">H</text>
          <rect x="92" y="8" width="44" height="22" fill="#9a5a32" stroke="#fbf6ea" stroke-width="3.5" stroke-linejoin="round"></rect>
          <text x="114" y="24" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-weight="700" font-size="13" fill="#fbf7ea">F</text>
          <polygon points="156,8 178,8 178,30 200,30 200,52 156,52" fill="#9b978d" stroke="#fbf6ea" stroke-width="3.5" stroke-linejoin="round"></polygon>
          <text x="167" y="45" text-anchor="middle" font-family="'Caveat', cursive" font-weight="700" font-size="17" fill="#fbf7ea">?</text>
          <rect x="220" y="8" width="22" height="22" fill="#2f5f6a" stroke="#fbf6ea" stroke-width="3.5" stroke-linejoin="round"></rect>
          <text x="231" y="24" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-weight="700" font-size="13" fill="#fbf7ea">D</text>
          <rect x="258" y="8" width="22" height="44" fill="#7b5a78" stroke="#fbf6ea" stroke-width="3.5" stroke-linejoin="round"></rect>
          <path d="M269 14c-6 6 6 10 0 16s6 10 0 16" stroke="#fbf6ea" stroke-width="2.2" fill="none" stroke-linecap="round"></path>
        </g>
        <g font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#3a4a52" text-anchor="middle">
          <text x="39" y="68">Hostess</text><text x="114" y="68">Financier</text><text x="178" y="68">Hunch</text><text x="231" y="68">Detective</text><text x="269" y="68">Rope</text>
        </g>
        <g fill="rgba(255,255,255,.55)" stroke="#9fb0b8" stroke-width="1.4" stroke-dasharray="3 3">
          <polygon points="6,86 28,86 28,108 50,108 50,130 6,130"></polygon>
          <rect x="92" y="96" width="44" height="22"></rect>
          <rect x="156" y="96" width="66" height="22"></rect>
        </g>
        <text x="296" y="130" text-anchor="end" font-family="'Caveat', cursive" font-weight="700" font-size="16" fill="#6b7a82">already used</text>
      </svg>
    </section>
  </div>
</div>
</body>
</html>
