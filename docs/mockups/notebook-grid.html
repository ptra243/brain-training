<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notebook pulled up on the grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;0,700;1,500&amp;family=Caveat:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#3a7058}
a{color:#8a2620}a:hover{color:#5a1426}
.hand{font-family:'Caveat',cursive;color:#2a2a3a}
.g{display:grid;grid-template-columns:80px repeat(6,36px);align-items:center}
.cell{height:36px;display:grid;place-items:center;border-left:1px solid rgba(42,42,58,.35);border-bottom:1px solid rgba(42,42,58,.35);font-family:'Caveat',cursive;font-weight:700;font-size:24px;line-height:1}
.x{color:#a8322d}
.o{color:#2a2a3a}
.name{height:36px;display:flex;align-items:center;border-bottom:1px solid rgba(42,42,58,.35);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:600;font-size:13px;color:#2a2a3a}
.head{display:flex;justify-content:flex-end;align-items:center;height:78px;padding-bottom:4px;box-sizing:border-box;writing-mode:vertical-rl;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:600;font-size:11.5px;color:#2a2a3a}
</style>
<style>body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="position: relative; width: 360px; height: 780px; box-sizing: border-box; padding: 18px 0 0; overflow: hidden; background-color: #3a7058; background-image: radial-gradient(rgba(255,255,255,.045) 1px, transparent 1px); background-size: 5px 5px; border-top: 10px solid #b37a44; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #f6eedb">

  <div aria-hidden="true">
    <div style="display: grid; grid-template-columns: 46px 1fr 46px; align-items: center; gap: 6px; padding: 0 12px">
      <span style="width: 40px; height: 40px; border-radius: 50%; background: #fbf4e2; box-shadow: inset 0 0 0 4px #9a5a32"></span>
      <div style="text-align: center">
        <p style="margin: 0; font-family: 'EB Garamond', Georgia, serif; font-weight: 600; font-size: 22px; line-height: 1.1">The Orchid Room</p>
        <p style="margin: 2px 0 0; font-size: 13px; color: #eadfc4">Medium · 5 guests</p>
      </div>
      <span></span>
    </div>
    <div style="display: flex; gap: 4px; padding: 14px 20px 0">
      <span style="width: 76px; height: 40px; border-radius: 8px 8px 0 0; background: #4f7a54"></span>
      <span style="width: 76px; height: 40px; border-radius: 8px 8px 0 0; background: #fbf7ec"></span>
      <span style="width: 76px; height: 40px; border-radius: 8px 8px 0 0; background: #3f5f8a"></span>
      <span style="width: 76px; height: 40px; border-radius: 8px 8px 0 0; background: #8a2e3b"></span>
    </div>
    <div style="margin: 0 12px; height: 200px; background: #8a2e3b; padding: 0 8px"><div style="height: 100%; background: #fbf7ec"></div></div>
    <span style="position: absolute; inset: 0; background: rgba(20,14,8,.42)"></span>
  </div>

  <section aria-label="Your notebook" style="position: absolute; left: 10px; right: 10px; top: 150px; bottom: 0; padding: 8px 8px 0; background: #b98a5a; border-radius: 10px 10px 0 0; box-shadow: 0 -8px 22px rgba(0,0,0,.45)">
    <span aria-hidden="true" style="position: absolute; left: 20px; right: 20px; top: -7px; display: flex; justify-content: space-between">
      <span style="width: 9px; height: 18px; border-radius: 5px; border: 2.5px solid #5b4a3a; box-sizing: border-box"></span><span style="width: 9px; height: 18px; border-radius: 5px; border: 2.5px solid #5b4a3a; box-sizing: border-box"></span><span style="width: 9px; height: 18px; border-radius: 5px; border: 2.5px solid #5b4a3a; box-sizing: border-box"></span><span style="width: 9px; height: 18px; border-radius: 5px; border: 2.5px solid #5b4a3a; box-sizing: border-box"></span><span style="width: 9px; height: 18px; border-radius: 5px; border: 2.5px solid #5b4a3a; box-sizing: border-box"></span><span style="width: 9px; height: 18px; border-radius: 5px; border: 2.5px solid #5b4a3a; box-sizing: border-box"></span><span style="width: 9px; height: 18px; border-radius: 5px; border: 2.5px solid #5b4a3a; box-sizing: border-box"></span><span style="width: 9px; height: 18px; border-radius: 5px; border: 2.5px solid #5b4a3a; box-sizing: border-box"></span><span style="width: 9px; height: 18px; border-radius: 5px; border: 2.5px solid #5b4a3a; box-sizing: border-box"></span><span style="width: 9px; height: 18px; border-radius: 5px; border: 2.5px solid #5b4a3a; box-sizing: border-box"></span><span style="width: 9px; height: 18px; border-radius: 5px; border: 2.5px solid #5b4a3a; box-sizing: border-box"></span><span style="width: 9px; height: 18px; border-radius: 5px; border: 2.5px solid #5b4a3a; box-sizing: border-box"></span>
    </span>

    <div style="height: 100%; box-sizing: border-box; padding: 10px 14px 0; display: flex; flex-direction: column; gap: 10px; background-color: #fbf7ea; background-image: linear-gradient(rgba(80,120,170,.16) 1px, transparent 1px), linear-gradient(90deg, rgba(80,120,170,.16) 1px, transparent 1px); background-size: 16px 16px; border-radius: 4px 4px 0 0; color: #2a2a3a">

      <button aria-label="Put the notebook away" style="align-self: center; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 30px; min-width: 120px; padding: 0; border: 0; background: none; cursor: pointer">
        <span style="width: 44px; height: 5px; border-radius: 3px; background: #c9bd9f"></span>
        <span style="font-size: 11px; color: #6b6458">Pull down to put away</span>
      </button>

      <nav aria-label="Notebook pages" style="display: flex; gap: 22px">
        <button style="min-height: 44px; padding: 0 4px; border: 0; background: none; cursor: pointer; font-family: 'Caveat', cursive; font-weight: 700; font-size: 26px; color: #6b6458">Clues <span style="font-size: 17px">(3)</span></button>
        <button aria-current="page" style="min-height: 44px; padding: 0 4px; border: 0; background: none; cursor: pointer; font-family: 'Caveat', cursive; font-weight: 700; font-size: 26px; color: #2a2a3a; text-decoration: underline; text-decoration-color: #a8322d; text-decoration-thickness: 3px; text-underline-offset: 6px">Who was where</button>
      </nav>

      <img src="shots/grid.png" alt="The real logic grid from the app, a few crosses and two ticks" style="display: block; width: 100%; height: auto; border-radius: 4px; box-shadow: 0 0 0 1px rgba(42,42,58,.15)">
      <p class="hand" style="margin: 0; font-weight: 700; font-size: 21px; line-height: 1.15">Heir in the bedroom, with the wrench <span style="color: #4f7a54">✓</span></p>
    </div>
  </section>
</div>
</body>
</html>
