<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puzzle book: a game full screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#3a7058;display:flex;justify-content:center;padding:24px 0}
</style>
</head>
<body>
<!-- A minigame opened from the puzzle book: full screen on the baize, with only the book's
     page edges down the left margin and a back button to the book. The game body is a real
     screenshot at the full 360px (the edge sits over its left margin), cropped below the app's own header. -->
<div style="position: relative; width: 360px; height: 780px; overflow: hidden; background: #24463c; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #e9e4d2">

  <span aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: 8px; z-index: 2; background: linear-gradient(90deg, #8a2e3b 0 3px, transparent 3px), repeating-linear-gradient(90deg, #fbf7ec 0 1.5px, #cdbf9f 1.5px 2px); box-shadow: 2px 0 6px rgba(0,0,0,.35)"></span>
  <span aria-hidden="true" style="position: absolute; left: 3px; top: 0; width: 12px; height: 34px; z-index: 3; background: #c8a24c; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%); filter: drop-shadow(0 1px 1px rgba(0,0,0,.4))"></span>

  <header style="position: absolute; left: 0; right: 0; top: 0; height: 68px; z-index: 1; box-sizing: border-box; padding: 0 12px 0 16px; display: grid; grid-template-columns: 46px 1fr auto; align-items: center; gap: 8px; background: #24463c">
    <a href="#book" aria-label="Back to the book" style="width: 46px; height: 46px; display: grid; place-items: center">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true" style="filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.45)); transform: rotate(-6deg)"><circle cx="20" cy="20" r="18" fill="#fbf4e2"></circle><circle cx="20" cy="20" r="14.5" fill="#9a5a32"></circle><path d="M23 13l-7 7 7 7" fill="none" stroke="#fbf4e2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </a>
    <div style="text-align: center; min-width: 0">
      <h1 id="name" style="margin: 0; font-family: 'EB Garamond', Georgia, serif; font-weight: 600; font-size: 22px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"></h1>
      <p style="margin: 2px 0 0; font-size: 12px; color: #b5c2b6">The Orchid Room · back to the book</p>
    </div>
    <button id="solve" style="min-height: 44px; padding: 0 16px; border: 0; border-radius: 22px; background: #1a352d; color: #e9e4d2; font: inherit; font-size: 16px">Solve</button>
  </header>

  <main style="position: absolute; left: 0; right: 0; top: 68px; bottom: 0; overflow-y: auto">
    <img id="shot" alt="" style="display: block; width: 360px; height: auto">
  </main>
</div>
<script>
const games = {"wordle":{"name":"Wordle","solve":true},"mini-crossword":{"name":"Mini crossword","solve":true},"word-search":{"name":"Word search","solve":true},"cat-puzzle":{"name":"Cat puzzle","solve":true},"sudoku":{"name":"Sudoku","solve":true},"questioning":{"name":"Questioning","solve":true},"case-board":{"name":"Case board","solve":true},"tarot-match":{"name":"Tarot match","solve":true},"nosing-around":{"name":"Nosing around","solve":false}};
const slug = new URLSearchParams(location.search).get('g') || 'mini-crossword';
const g = games[slug] || games['mini-crossword'];
document.getElementById('name').textContent = g.name;
document.title = 'Puzzle book: ' + g.name;
if (!g.solve) document.getElementById('solve').style.visibility = 'hidden';
const img = document.getElementById('shot');
img.src = 'shots/game-' + (games[slug] ? slug : 'mini-crossword') + '.png';
img.alt = 'The real ' + g.name + ' from the app, at 360px wide';
</script>
</body>
</html>
