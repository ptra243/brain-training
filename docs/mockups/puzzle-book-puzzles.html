<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Puzzle book contents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;0,700;1,500&amp;family=Caveat:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#3a7058;display:flex;justify-content:center;padding:24px 0}
.tab{width:76px;height:40px;border:0;border-radius:8px 8px 0 0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'EB Garamond',Georgia,serif;font-weight:600;font-size:15px}
.serif{font-family:'EB Garamond',Georgia,serif}
.row{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;min-height:56px;padding:9px 4px 9px 0;border:0;border-bottom:1px dotted #b9ab8c;background:none;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.num{font-family:'EB Garamond',Georgia,serif;font-weight:700;font-size:22px;line-height:1;color:#8a2e3b;text-align:right}
.name{font-family:'EB Garamond',Georgia,serif;font-weight:600;font-size:17px;line-height:1.15}
.diff{font-family:system-ui,sans-serif;font-size:11px;font-weight:600;letter-spacing:.06em;color:#55615f;margin-left:4px}
.about{display:block;margin-top:2px;font-size:12.5px;line-height:1.3;color:#55615f}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding-top:1px}
.page{font-family:'EB Garamond',Georgia,serif;font-size:15px;color:#1e2a2f}
.clues{font-size:11.5px;color:#55615f;white-space:nowrap}
.pencil{font-family:'Caveat',cursive;font-weight:700;font-size:17px;line-height:1}
</style>
</head>
<body>
<!-- The Puzzles tab of the puzzle book: a contents page. Tapping a puzzle turns to its page
     (puzzle-page.html), whose top already says how to play, so the app's separate
     "Pick a game" help step isn't needed. Real game list and wording from a Hard Quick play
     case, shown part-way: one puzzle solved by her, one solved for her. -->
<div style="position: relative; width: 360px; height: 780px; box-sizing: border-box; padding: 18px 0 0; display: flex; flex-direction: column; overflow: hidden; background-color: #3a7058; background-image: radial-gradient(rgba(255,255,255,.045) 1px, transparent 1px); background-size: 5px 5px; border-top: 10px solid #b37a44; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #f6eedb">

  <header style="display: grid; grid-template-columns: 46px 1fr 46px; align-items: center; gap: 6px; padding: 0 12px">
    <a href="#shelf" aria-label="Back to the shelf" style="width: 46px; height: 46px; display: grid; place-items: center">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true" style="filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.45)); transform: rotate(-6deg)"><circle cx="20" cy="20" r="18" fill="#fbf4e2"></circle><circle cx="20" cy="20" r="14.5" fill="#9a5a32"></circle><path d="M23 13l-7 7 7 7" fill="none" stroke="#fbf4e2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </a>
    <div style="text-align: center">
      <h1 class="serif" style="margin: 0; font-weight: 600; font-size: 19px; line-height: 1.1">The Hidden Pansy Intrigue at Hollywood</h1>
      <p style="margin: 3px 0 0; font-size: 13px; color: #eadfc4">Hard · 7 guests</p>
    </div>
    <span aria-hidden="true"></span>
  </header>

  <nav aria-label="Puzzle book sections" style="display: flex; gap: 4px; padding: 12px 20px 0">
    <button class="tab" style="background: #4f7a54; color: #fbf3e0">Case</button>
    <button class="tab" style="background: #9a5a32; color: #fbf3e0">Map</button>
    <button aria-current="page" class="tab" style="background: #fbf7ec; color: #8a2e3b; box-shadow: 0 -2px 4px rgba(0,0,0,.15)">Puzzles</button>
    <button class="tab" style="background: #8a2e3b; color: #fbf3e0">Answer</button>
  </nav>

  <div style="margin: 0 12px; background: #8a2e3b; border-radius: 4px 4px 8px 8px; padding: 0 8px 8px; box-shadow: 0 16px 28px rgba(0,0,0,.45)">
    <article style="background: #fbf7ec; border-radius: 0 0 3px 3px; padding: 14px 14px 140px; display: flex; flex-direction: column; gap: 4px; color: #1e2a2f">
      <div style="display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1.5px solid #1e2a2f; padding-bottom: 5px; margin-bottom: 2px">
        <span class="serif" style="font-weight: 700; font-size: 15px; letter-spacing: .04em">CONTENTS</span>
        <span class="serif" style="font-style: italic; font-size: 14px; color: #55615f">13 of 25 clues found</span>
      </div>

      <button class="row" aria-label="Puzzle 1, Mini crossword: solved, 7 clues found">
        <span class="num">1</span>
        <span><span class="name">Mini crossword</span><span class="about">Answer clues until the shaded squares spell the word.</span></span>
        <span class="side"><span class="pencil" style="color: #3d6b4f">✓ solved</span><span class="clues">7 clues found</span></span>
      </button>

      <button class="row" aria-label="Puzzle 2, Word search, hard: 7 clues, page 16">
        <span class="num">2</span>
        <span><span class="name">Word search</span><span class="diff">HARD</span><span class="about">Find the words; the leftover letters spell it.</span></span>
        <span class="side"><span class="page">p. 16</span><span class="clues">7 clues</span></span>
      </button>

      <button class="row" aria-label="Puzzle 3, Tarot match, hard: solved for you, 6 clues found">
        <span class="num">3</span>
        <span><span class="name" style="color: #55615f">Tarot match</span><span class="diff">HARD</span><span class="about">Turn the cards over and find the pairs.</span></span>
        <span class="side"><span class="pencil" style="color: #8a8270">solved for me</span><span class="clues">6 clues found</span></span>
      </button>

      <button class="row" aria-label="Puzzle 4, Questioning, easy: 3 clues, page 20">
        <span class="num">4</span>
        <span><span class="name">Questioning</span><span class="diff">EASY</span><span class="about">Question a guest and catch the lie.</span></span>
        <span class="side"><span class="page">p. 20</span><span class="clues">3 clues</span></span>
      </button>

      <div class="row" aria-label="Puzzle 5, Final questioning: opens when the other games are done" style="cursor: default; border-bottom: 0; opacity: .6">
        <span class="num" style="color: #8a8270">5</span>
        <span><span class="name">Final questioning</span><span class="about">One last round of questions. Opens when the other games are done.</span></span>
        <span class="side"><svg width="16" height="18" viewBox="0 0 16 18" aria-hidden="true"><rect x="2" y="8" width="12" height="9" rx="1.5" fill="#55615f"></rect><path d="M5 8V5.5a3 3 0 0 1 6 0V8" fill="none" stroke="#55615f" stroke-width="1.8"></path></svg></span>
      </div>

      <p class="serif" style="margin: 8px 0 0; font-style: italic; font-size: 14px; line-height: 1.35; color: #55615f; text-align: center">You don't need to play them all: stop once you can name who did it.</p>
    </article>
  </div>

  <a href="#notebook" aria-label="Open your notebook: 13 clues" style="position: absolute; left: 14px; right: 14px; bottom: 0; height: 132px; box-sizing: border-box; padding: 22px 16px 0; background: #b98a5a; border-radius: 10px 10px 0 0; box-shadow: 0 -6px 18px rgba(0,0,0,.4); text-decoration: none; display: flex; flex-direction: column; gap: 8px">
    <span aria-hidden="true" style="position: absolute; left: 18px; right: 18px; top: -7px; display: flex; justify-content: space-between">
      <span style="width: 9px; height: 18px; border-radius: 5px; border: 2.5px solid #5b4a3a; box-sizing: border-box"></span><span style="width: 9px; height: 18px; border-radius: 5px; border: 2.5px solid #5b4a3a; box-sizing: border-box"></span><span style="width: 9px; height: 18px; border-radius: 5px; border: 2.5px solid #5b4a3a; box-sizing: border-box"></span><span style="width: 9px; height: 18px; border-radius: 5px; border: 2.5px solid #5b4a3a; box-sizing: border-box"></span><span style="width: 9px; height: 18px; border-radius: 5px; border: 2.5px solid #5b4a3a; box-sizing: border-box"></span><span style="width: 9px; height: 18px; border-radius: 5px; border: 2.5px solid #5b4a3a; box-sizing: border-box"></span><span style="width: 9px; height: 18px; border-radius: 5px; border: 2.5px solid #5b4a3a; box-sizing: border-box"></span><span style="width: 9px; height: 18px; border-radius: 5px; border: 2.5px solid #5b4a3a; box-sizing: border-box"></span><span style="width: 9px; height: 18px; border-radius: 5px; border: 2.5px solid #5b4a3a; box-sizing: border-box"></span><span style="width: 9px; height: 18px; border-radius: 5px; border: 2.5px solid #5b4a3a; box-sizing: border-box"></span><span style="width: 9px; height: 18px; border-radius: 5px; border: 2.5px solid #5b4a3a; box-sizing: border-box"></span><span style="width: 9px; height: 18px; border-radius: 5px; border: 2.5px solid #5b4a3a; box-sizing: border-box"></span>
    </span>
    <span aria-hidden="true" style="position: absolute; right: 26px; top: 0; bottom: 0; width: 10px; background: #8a2e3b"></span>
    <span style="display: flex; align-items: center; gap: 12px">
      <span style="padding: 4px 14px 6px; background: #fbf4e2; border-radius: 2px; transform: rotate(-2deg); box-shadow: 0 1px 2px rgba(0,0,0,.3); font-family: 'Caveat', cursive; font-weight: 700; font-size: 24px; line-height: 1; color: #2a2a3a">My notes</span>
    </span>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #2e1e10">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
      13 clues · tap to open
    </span>
  </a>
</div>
</body>
</html>
