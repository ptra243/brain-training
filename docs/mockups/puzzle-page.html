<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puzzle page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;0,700;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#3a7058;display:flex;justify-content:center;padding:24px 0}
</style>
</head>
<body>
<!-- A minigame opened from the puzzle book, printed on its own page: ivory paper, a running
     head, a ribbon bookmark to go back, the spine's shadow down the left and the other
     pages' edges down the right. Both sit over the game's own margins, so the game keeps
     the full 360px. The game is a real screenshot with the app's colour variables set to
     paper (shots/paper-*.png); the app itself is unchanged. -->
<div style="position: relative; width: 360px; height: 780px; overflow: hidden; background: #f4ecd8; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #1e2a2f">

  <span aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: 22px; z-index: 2; pointer-events: none; background: linear-gradient(90deg, #8a2e3b 0 3px, rgba(60,40,20,.28) 3px, rgba(60,40,20,.08) 10px, transparent 22px)"></span>
  <span aria-hidden="true" style="position: absolute; right: 0; top: 0; bottom: 0; width: 5px; z-index: 2; pointer-events: none; background: repeating-linear-gradient(90deg, #e9e0c8 0 1px, #f4ecd8 1px 2.5px); box-shadow: inset 1px 0 0 #d8ccb0"></span>

  <header style="position: absolute; left: 0; right: 0; top: 0; height: 80px; z-index: 1; background: #f4ecd8">
    <div style="position: absolute; left: 66px; right: 16px; top: 10px; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1.5px solid #1e2a2f; padding-bottom: 4px">
      <span id="num" style="font-family: 'EB Garamond', Georgia, serif; font-weight: 700; font-size: 13px; letter-spacing: .12em"></span>
      <span style="font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 13px; color: #55615f">The Hidden Pansy Intrigue</span>
    </div>
    <h1 id="name" style="position: absolute; left: 66px; right: 96px; top: 38px; margin: 0; font-family: 'EB Garamond', Georgia, serif; font-weight: 600; font-size: 25px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"></h1>
    <button id="solve" style="position: absolute; right: 14px; top: 34px; min-height: 40px; min-width: 72px; padding: 0 14px; border: 1.5px solid #1e2a2f; border-radius: 20px; background: transparent; color: #1e2a2f; font-family: 'EB Garamond', Georgia, serif; font-weight: 600; font-size: 17px">Solve</button>
    <a href="#book" aria-label="Back to the book" style="position: absolute; left: 14px; top: 0; width: 40px; height: 66px; z-index: 3; display: grid; place-items: start center; padding-top: 22px; box-sizing: border-box; background: #8a2e3b; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 84%, 0 100%); filter: drop-shadow(0 2px 2px rgba(0,0,0,.35))">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fbf3e0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
  </header>

  <main style="position: absolute; left: 0; right: 0; top: 80px; bottom: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none">
    <img id="shot" alt="" style="display: block; width: 360px; height: auto">
    <p id="page" style="margin: 8px 0 22px; text-align: center; font-family: 'EB Garamond', Georgia, serif; font-size: 14px; color: #8a8270"></p>
  </main>

  <!-- The Solve dialog as a slip of paper taped over the page (&dialog=solve). Wording is the app's. -->
  <div id="solve-dialog" hidden style="position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(40,28,14,.5)">
    <div role="dialog" aria-modal="true" aria-labelledby="solve-title" style="position: relative; width: 296px; box-sizing: border-box; padding: 26px 22px 20px; background: #fffcf3; border-radius: 2px; box-shadow: 0 10px 28px rgba(0,0,0,.45); transform: rotate(-1deg); color: #1e2a2f">
      <span aria-hidden="true" style="position: absolute; left: 50%; top: -11px; width: 86px; height: 22px; margin-left: -43px; background: rgba(232,222,190,.85); box-shadow: 0 1px 2px rgba(0,0,0,.15); transform: rotate(2deg)"></span>
      <h2 id="solve-title" style="margin: 0 0 8px; font-family: 'EB Garamond', Georgia, serif; font-weight: 600; font-size: 23px">Solve this puzzle?</h2>
      <p style="margin: 0 0 18px; font-size: 15px; line-height: 1.4; color: #3b4649">Are you sure? This can't be undone. You'll see the answer and still get the clues.</p>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
        <button style="min-height: 46px; border: 1.5px solid #1e2a2f; border-radius: 23px; background: transparent; color: #1e2a2f; font-family: 'EB Garamond', Georgia, serif; font-weight: 600; font-size: 17px">Keep playing</button>
        <button style="min-height: 46px; border: 0; border-radius: 23px; background: #a8322d; color: #fffcf3; font-family: 'EB Garamond', Georgia, serif; font-weight: 600; font-size: 17px">Solve it</button>
      </div>
    </div>
  </div>
</div>
<script>
const games = {"wordle":{"name":"Wordle","solve":true,"n":5,"page":22},"mini-crossword":{"name":"Mini crossword","solve":true,"n":1,"page":14},"word-search":{"name":"Word search","solve":true,"n":2,"page":16},"cat-puzzle":{"name":"Cat puzzle","solve":true,"n":6,"page":24},"sudoku":{"name":"Sudoku","solve":true,"n":7,"page":26},"questioning":{"name":"Questioning","solve":true,"n":4,"page":20},"case-board":{"name":"Case board","solve":true,"n":8,"page":28},"tarot-match":{"name":"Tarot match","solve":true,"n":3,"page":18},"nosing-around":{"name":"Nosing around","solve":false,"n":9,"page":30}};
const slug = games[new URLSearchParams(location.search).get('g')] ? new URLSearchParams(location.search).get('g') : 'mini-crossword';
const g = games[slug];
document.getElementById('name').textContent = g.name;
document.getElementById('num').textContent = 'PUZZLE ' + g.n;
document.getElementById('page').textContent = '— ' + g.page + ' —';
document.title = 'Puzzle page: ' + g.name;
if (!g.solve) document.getElementById('solve').style.visibility = 'hidden';
const img = document.getElementById('shot');
img.src = 'shots/paper-' + slug + '.png';
if (new URLSearchParams(location.search).get('dialog') === 'solve') document.getElementById('solve-dialog').hidden = false;
img.alt = 'The real ' + g.name + ' from the app, recoloured for paper, at 360px wide';
</script>
</body>
</html>
