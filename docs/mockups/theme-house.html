<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Theme: the house in cutaway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;0,700;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#182033}
a{color:#e8c86e}a:hover{color:#f6dc92}
.room{position:relative;display:flex;flex-direction:column;gap:3px;padding:10px 10px 8px;text-decoration:none;color:#1e2a2f;overflow:hidden;box-shadow:inset 0 -10px 0 rgba(0,0,0,.08)}
.room-tag{font-size:10px;font-weight:700;letter-spacing:.14em;color:#4e4a3f}
.room-title{font-family:'EB Garamond',Georgia,serif;font-weight:600;font-size:18px;line-height:1.1}
.room-sub{font-size:12px;color:#3f4a4d}
</style>
<style>body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 18px 0; display: flex; flex-direction: column; gap: 10px; background: #182033; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #e6e1d3; overflow: hidden">

  <header style="position: relative; display: flex; align-items: flex-start; justify-content: space-between; padding-top: 8px">
    <div>
      <h1 style="margin: 0; font-family: 'EB Garamond', Georgia, serif; font-weight: 600; font-size: 34px; line-height: 1; color: #f0ead8">Casebook</h1>
      <p style="margin: 4px 0 0; font-size: 14px; color: #b3bdd0">Where to tonight?</p>
    </div>
    <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 50%; background: #efe6c4; box-shadow: 0 0 24px rgba(239,230,196,.35), inset -10px -4px 0 #d8cda5"></span>
  </header>

  <div style="display: flex; flex-direction: column; margin-top: 4px">
    <div aria-hidden="true" style="position: relative; height: 84px">
      <span style="position: absolute; right: 70px; top: 6px; width: 24px; height: 46px; background: #4a3328"></span>
      <span style="position: absolute; left: -6px; right: -6px; bottom: 0; height: 84px; background: #4a3328; clip-path: polygon(50% 0, 100% 100%, 0 100%)"></span>
      <span style="position: absolute; left: 50%; bottom: 18px; width: 30px; height: 30px; margin-left: -15px; border-radius: 50%; background: #e8c86e; box-shadow: inset 0 0 0 4px #2a2620"></span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)) 108px; grid-template-rows: repeat(3, 172px); gap: 6px; padding: 6px; background: #2a2620">

      <a href="#record" class="room" style="grid-column: 1 / 3; grid-row: 1; background: #dccba4">
        <span class="room-tag">LIBRARY</span>
        <span class="room-title">Your record</span>
        <span class="room-sub">12 cases solved, 2 campaigns</span>
        <svg width="210" height="62" viewBox="0 0 210 62" aria-hidden="true" style="position: absolute; left: 10px; bottom: 14px"><rect x="0" y="58" width="210" height="4" fill="#6b4529"></rect><rect x="0" y="22" width="12" height="36" fill="#5a1426"></rect><rect x="14" y="16" width="10" height="42" fill="#2f5a4a"></rect><rect x="26" y="24" width="14" height="34" fill="#34436a"></rect><rect x="42" y="18" width="9" height="40" fill="#8e6f27"></rect><rect x="53" y="26" width="12" height="32" fill="#5a1426"></rect><rect x="67" y="14" width="11" height="44" fill="#3e2a44"></rect><rect x="80" y="22" width="10" height="36" fill="#2f5a4a"></rect><rect x="96" y="24" width="12" height="34" fill="#34436a" transform="rotate(-10 96 58)"></rect><rect x="150" y="30" width="60" height="28" fill="#6b4529"></rect><circle cx="180" cy="22" r="7" fill="#c8a24c"></circle></svg>
      </a>

      <a href="#campaign" class="room" style="grid-column: 3; grid-row: 1 / 4; background: #cdb9cf">
        <span class="room-tag">STAIRS</span>
        <span class="room-title">Campaign</span>
        <span class="room-sub">Midnight, round 2 of 3</span>
        <span style="display: flex; gap: 4px; margin-top: 4px" aria-label="2 accusations left">
          <svg width="12" height="16" viewBox="0 0 14 18" aria-hidden="true"><path d="M7 1c2 3 2 5 0 7-2-2-2-4 0-7z" fill="#c8862a"></path><rect x="4" y="9" width="6" height="9" rx="1" fill="#f7f2e4"></rect></svg>
          <svg width="12" height="16" viewBox="0 0 14 18" aria-hidden="true"><path d="M7 1c2 3 2 5 0 7-2-2-2-4 0-7z" fill="#c8862a"></path><rect x="4" y="9" width="6" height="9" rx="1" fill="#f7f2e4"></rect></svg>
          <svg width="12" height="16" viewBox="0 0 14 18" aria-hidden="true"><rect x="4" y="9" width="6" height="9" rx="1" fill="#8b7a8d"></rect></svg>
        </span>
        <svg width="96" height="380" viewBox="0 0 96 380" aria-hidden="true" style="position: absolute; left: 0; bottom: 0"><path d="M0 380V350h16v-30h16v-30h16v-30h16v-30h16v-30h16v260z" fill="#9c839f"></path><path d="M0 220v-20h20v-20h20v-20h20v-20h20v-20h16v100z" fill="#9c839f" opacity=".55"></path><rect x="58" y="22" width="30" height="40" rx="15" fill="#2a2620"></rect><circle cx="73" cy="42" r="10" fill="#f7f2e4"></circle><path d="M73 36v6l4 3" stroke="#2a2620" stroke-width="2" fill="none" stroke-linecap="round"></path></svg>
      </a>

      <a href="#choose" class="room" style="grid-column: 1 / 3; grid-row: 2; background: #b9c9b1">
        <span class="room-tag">STUDY</span>
        <span class="room-title">Choose your games</span>
        <span class="room-sub">Cards laid out on the desk</span>
        <svg width="210" height="62" viewBox="0 0 210 62" aria-hidden="true" style="position: absolute; left: 10px; bottom: 14px"><rect x="20" y="30" width="170" height="8" fill="#6b4529"></rect><rect x="30" y="38" width="8" height="24" fill="#6b4529"></rect><rect x="172" y="38" width="8" height="24" fill="#6b4529"></rect><rect x="60" y="6" width="22" height="30" rx="2" fill="#f7f2e4" stroke="#8b8577" transform="rotate(-12 71 30)"></rect><rect x="84" y="2" width="22" height="30" rx="2" fill="#5a1426" stroke="#c8a24c"></rect><rect x="108" y="6" width="22" height="30" rx="2" fill="#f7f2e4" stroke="#8b8577" transform="rotate(12 119 30)"></rect><rect x="146" y="12" width="6" height="18" fill="#f7f2e4"></rect><path d="M149 6c2 3 2 4 0 6-2-2-2-3 0-6z" fill="#c8862a"></path></svg>
      </a>

      <a href="#continue" aria-label="Dining room, your case The Orchid Room, 3 of 5 clues: continue" class="room" style="grid-column: 1; grid-row: 3; background: #e6c3a6">
        <span class="room-tag">DINING</span>
        <span class="room-title">The Orchid Room</span>
        <span class="room-sub">3 of 5 clues</span>
        <svg width="96" height="54" viewBox="0 0 96 54" aria-hidden="true" style="position: absolute; left: 8px; bottom: 12px"><rect x="0" y="34" width="70" height="6" fill="#6b4529"></rect><rect x="6" y="40" width="5" height="14" fill="#6b4529"></rect><rect x="59" y="40" width="5" height="14" fill="#6b4529"></rect><ellipse cx="80" cy="48" rx="14" ry="7" fill="#2a2620"></ellipse><path d="M86 42l3-6 3 6z" fill="#2a2620"></path><path d="M66 50c-6 0-8 4-2 4" stroke="#2a2620" stroke-width="3" fill="none" stroke-linecap="round"></path><text x="90" y="30" font-family="Georgia, serif" font-size="11" fill="#5a3a2a">z</text></svg>
      </a>

      <a href="#new-case" class="room" style="grid-column: 2; grid-row: 3; background: #e9dfc2">
        <span class="room-tag">KITCHEN</span>
        <span class="room-title">New case</span>
        <span class="room-sub">Something's cooking</span>
        <svg width="80" height="54" viewBox="0 0 80 54" aria-hidden="true" style="position: absolute; left: 10px; bottom: 12px"><rect x="0" y="30" width="80" height="24" fill="#8b8577"></rect><rect x="22" y="14" width="36" height="16" rx="3" fill="#2a2620"></rect><path d="M30 10c-3-4 3-6 0-10M40 10c-3-4 3-6 0-10M50 10c-3-4 3-6 0-10" stroke="#8b8577" stroke-width="1.5" fill="none"></path></svg>
      </a>
    </div>
    <div aria-hidden="true" style="height: 28px; margin: 0 -18px; background: #22392f"></div>
  </div>
</div>
</body>
</html>
